<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SABLYN — Marketing Budget 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:       #F9F7F4;
  --surface:  #FFFFFF;
  --ink:      #1C1917;
  --mid:      #6B6560;
  --light:    #9C9590;
  --rule:     #E4DDD6;
  --rule-lt:  #EDE8E3;
  --sage:     #6E9880;
  --sienna:   #B5644A;
  --champagne:#C8AA82;
  --meta-blue:#3B5BDB;
  --google-green:#2E7D52;
  --font: 'Inter', system-ui, sans-serif;
}

body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 14px;
  line-height: 1.5;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

/* ── LAYOUT ── */
.app { max-width: 1080px; margin: 0 auto; padding: 2.5rem 2rem 4rem; }

/* ── HEADER ── */
.site-header {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  padding-bottom: 1.5rem;
  border-bottom: 1px solid var(--rule);
  margin-bottom: 2rem;
}
.wordmark {
  font-family: 'Arial Black', 'Avenir Black', Impact, sans-serif;
  font-weight: 900;
  font-size: 22px;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: var(--ink);
}
.header-meta { font-size: 13px; color: var(--light); letter-spacing: .04em; }

/* ── BUDGET CODE CARDS ── */
.budget-cards {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  margin-bottom: 2.5rem;
}
.bcard {
  background: var(--surface);
  border: 1px solid var(--rule);
  border-radius: 6px;
  padding: 1.25rem 1.25rem 1rem;
  cursor: pointer;
  transition: border-color .15s, box-shadow .15s;
  position: relative;
}
.bcard:hover { border-color: var(--champagne); box-shadow: 0 2px 12px rgba(0,0,0,.05); }
.bcard.active { border-color: var(--ink); }
.bcard.active::after {
  content: '';
  position: absolute;
  bottom: -13px; left: 50%;
  transform: translateX(-50%);
  width: 0; height: 0;
  border-left: 8px solid transparent;
  border-right: 8px solid transparent;
  border-top: 8px solid var(--ink);
}
.bcard-code { font-size: 11px; font-weight: 600; letter-spacing: .1em; color: var(--light); text-transform: uppercase; margin-bottom: 4px; }
.bcard-name { font-size: 13px; font-weight: 500; color: var(--mid); margin-bottom: 1rem; line-height: 1.3; }
.bcard-spent { font-size: 26px; font-weight: 300; letter-spacing: -.01em; line-height: 1; margin-bottom: 2px; }
.bcard-budget { font-size: 12px; color: var(--light); margin-bottom: 12px; }
.bbar-track {
  height: 8px;
  background: var(--rule-lt);
  border-radius: 4px;
  overflow: hidden;
  margin-bottom: 8px;
  display: flex;
}
.bbar-paid { height: 8px; background: var(--sage); border-radius: 4px 0 0 4px; transition: width .6s ease; }
.bbar-committed { height: 8px; background: var(--champagne); transition: width .6s ease; }
.bcard-meta {
  display: flex;
  justify-content: space-between;
  font-size: 11px;
  color: var(--light);
}
.bcard-meta .pct { font-weight: 600; color: var(--mid); }

/* ── TAB PANEL ── */
.panel {
  background: var(--surface);
  border: 1px solid var(--rule);
  border-radius: 6px;
  overflow: hidden;
}
.panel-header {
  padding: 1.25rem 1.5rem;
  border-bottom: 1px solid var(--rule);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.panel-title { font-size: 15px; font-weight: 600; }
.panel-subtitle { font-size: 13px; color: var(--light); }
.panel-body { padding: 1.5rem; }

/* ── SECTION HEADERS ── */
.sec-label {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--light);
  margin-bottom: 10px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.sec-label .sec-total { font-size: 13px; font-weight: 500; color: var(--mid); letter-spacing: 0; text-transform: none; }

/* ── TABLE ── */
.data-table { width: 100%; border-collapse: collapse; margin-bottom: 1.5rem; }
.data-table th {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .07em;
  text-transform: uppercase;
  color: var(--light);
  text-align: left;
  padding: 0 10px 8px;
  border-bottom: 1px solid var(--rule);
}
.data-table th.r { text-align: right; }
.data-table td {
  padding: 10px 10px;
  border-bottom: 1px solid var(--rule-lt);
  font-size: 14px;
  vertical-align: middle;
}
.data-table tbody tr:last-child td { border-bottom: none; }
.data-table tbody tr:hover td { background: #FDFBF9; }
.data-table td.r { text-align: right; }
.data-table td.num { font-size: 15px; font-weight: 400; font-variant-numeric: tabular-nums; }
.data-table td.dim { color: var(--light); font-size: 13px; }
.data-table tfoot td {
  padding: 10px 10px;
  border-top: 1px solid var(--rule);
  font-weight: 600;
  font-size: 14px;
}

/* ── PILLS ── */
.pill {
  display: inline-block;
  font-size: 11px;
  font-weight: 500;
  padding: 2px 8px;
  border-radius: 20px;
  line-height: 1.6;
}
.pill-meta    { background: #EEF2FF; color: #3B5BDB; }
.pill-google  { background: #ECFDF5; color: #2E7D52; }
.pill-vendor  { background: #FFF7ED; color: #9A3412; }
.pill-tool    { background: #F0F9FF; color: #0369A1; }
.pill-paid    { background: #F0FDF4; color: #166534; }
.pill-unpaid  { background: #FEF9EE; color: #92400E; }

/* ── CHECKBOX PAID ── */
.paid-cb { display: flex; align-items: center; gap: 6px; cursor: pointer; }
.paid-cb input[type=checkbox] {
  appearance: none; width: 15px; height: 15px;
  border: 1.5px solid var(--rule); border-radius: 3px;
  background: white; cursor: pointer; position: relative;
  transition: all .15s; flex-shrink: 0;
}
.paid-cb input[type=checkbox]:checked {
  background: var(--sage); border-color: var(--sage);
}
.paid-cb input[type=checkbox]:checked::after {
  content: '';
  position: absolute;
  left: 4px; top: 1px;
  width: 4px; height: 8px;
  border: 2px solid white;
  border-top: none; border-left: none;
  transform: rotate(45deg);
}
.paid-cb span { font-size: 12px; color: var(--light); }
.paid-cb.is-paid span { color: var(--sage); }

/* ── STAT ROW ── */
.stat-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 1px;
  background: var(--rule);
  border: 1px solid var(--rule);
  border-radius: 6px;
  overflow: hidden;
  margin-bottom: 1.5rem;
}
.stat {
  background: var(--surface);
  padding: 1rem 1.25rem;
}
.stat-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--light); margin-bottom: 4px; }
.stat-val { font-size: 22px; font-weight: 300; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
.stat-val.good { color: var(--sage); }
.stat-val.warn { color: var(--sienna); }

/* ── MONTH BREAKDOWN ── */
.month-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin-bottom: 1.5rem; }
.month-card {
  border: 1px solid var(--rule);
  border-radius: 5px;
  padding: .75rem;
  cursor: pointer;
  transition: border-color .15s;
}
.month-card:hover { border-color: var(--champagne); }
.month-card.paid-m { background: #F6FBF8; border-color: #B8D9C8; }
.month-name { font-size: 11px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--light); margin-bottom: 4px; }
.month-card.paid-m .month-name { color: var(--sage); }
.month-amt { font-size: 16px; font-weight: 400; font-variant-numeric: tabular-nums; }
.month-check { margin-top: 6px; }

/* ── SPLIT BAR ── */
.split-bars { display: flex; flex-direction: column; gap: 8px; margin-bottom: 1.5rem; }
.split-row { display: flex; align-items: center; gap: 10px; }
.split-label { font-size: 13px; min-width: 160px; color: var(--mid); }
.split-track { flex: 1; height: 8px; background: var(--rule-lt); border-radius: 4px; overflow: hidden; }
.split-fill { height: 8px; border-radius: 4px; transition: width .5s ease; }
.split-amt { font-size: 13px; font-variant-numeric: tabular-nums; min-width: 80px; text-align: right; color: var(--mid); }

/* ── ADD FORM ── */
.add-row { display: flex; gap: 8px; align-items: flex-end; padding: 12px; background: #FDFBF9; border: 1px solid var(--rule); border-radius: 5px; margin-top: 8px; }
.add-field { display: flex; flex-direction: column; gap: 3px; flex: 1; }
.add-field label { font-size: 11px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--light); }
.add-field input, .add-field select {
  font-family: var(--font); font-size: 13px; padding: 7px 10px;
  border: 1px solid var(--rule); border-radius: 4px;
  background: white; color: var(--ink); outline: none;
  transition: border-color .15s;
}
.add-field input:focus, .add-field select:focus { border-color: var(--champagne); }

/* ── BUTTONS ── */
.btn { font-family: var(--font); font-size: 12px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; padding: 7px 16px; border: none; border-radius: 4px; cursor: pointer; transition: opacity .15s; white-space: nowrap; }
.btn-dark { background: var(--ink); color: white; }
.btn-dark:hover { opacity: .8; }
.btn-ghost { background: transparent; color: var(--light); border: 1px solid var(--rule); }
.btn-ghost:hover { border-color: var(--mid); color: var(--mid); }
.btn-sm { font-size: 11px; padding: 5px 12px; }

/* ── DIVIDER ── */
.divider { height: 1px; background: var(--rule); margin: 1.5rem 0; }

/* ── LOADING / EMPTY ── */
.loading-msg { text-align: center; padding: 3rem; font-size: 13px; color: var(--light); letter-spacing: .05em; }
.error-msg { padding: .75rem 1rem; background: #FEF2F0; border: 1px solid #F5C6C0; border-radius: 4px; font-size: 13px; color: var(--sienna); margin-bottom: 1rem; }

/* ── FILTER CHIPS ── */
.filter-row {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-bottom: 10px;
  align-items: center;
}
.filter-label {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--light);
  min-width: 48px;
}
.chip {
  font-family: var(--font);
  font-size: 12px;
  font-weight: 500;
  padding: 5px 14px;
  border: 1px solid var(--rule);
  border-radius: 20px;
  background: white;
  color: var(--mid);
  cursor: pointer;
  transition: all .15s;
  white-space: nowrap;
}
.chip:hover { border-color: var(--champagne); color: var(--ink); }
.chip.active { background: var(--ink); color: white; border-color: var(--ink); }
.filter-section { margin-bottom: 1.25rem; }

/* ── RESPONSIVE ── */
@media (max-width: 700px) {
  .budget-cards { grid-template-columns: 1fr 1fr; }
  .stat-row { grid-template-columns: 1fr 1fr; }
  .month-grid { grid-template-columns: repeat(3, 1fr); }
}
@media (max-width: 480px) {
  .budget-cards { grid-template-columns: 1fr; }
  .bcard.active::after { display: none; }
}
</style>
</head>
<body>
<div class="app">

  <!-- HEADER -->
  <header class="site-header">
    <div class="wordmark">SABLYN</div>
    <div class="header-meta">Marketing Budget · 2026</div>
  </header>

  <!-- BUDGET CODE CARDS -->
  <div class="budget-cards" id="budget-cards">
    <div class="bcard active" data-tab="6014" onclick="switchTab('6014')">

      <div class="bcard-code">6016</div>

      <div class="bcard-spent" id="c6016-spent">—</div>
      <div class="bcard-budget" id="c6016-budget">of $50,000</div>
      <div class="bbar-track">
        <div class="bbar-paid" id="c6016-bar-paid" style="width:0%"></div>
        <div class="bbar-committed" id="c6016-bar-comm" style="width:0%"></div>

      <div class="bcard-budget" id="c6018-budget">of $105,000</div>
      <div class="bbar-track">
        <div class="bbar-paid" id="c6018-bar-paid" style="width:0%"></div>
        <div class="bbar-committed" id="c6018-bar-comm" style="width:0%"></div>
      </div>
      <div class="bcard-meta">

  </div>

  <!-- DETAIL PANEL -->
  <div class="panel" id="detail-panel">
    <div class="loading-msg" id="panel-loading">Loading...</div>
    <div id="panel-content" style="display:none"></div>
  </div>

</div>
<script>
const PROXY = 'https://sablyn-budget-proxy.itsme-5cf.workers.dev';
const BASE  = 'appEPuHeDmRhiTIig';
const BUDGETS = { '6014': 210000, '6015': 200000, '6016': 50000, '6018': 105000 };
const MONTHS  = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const TYPES   = ['ECOM','JOOR','Lookbook','Content'];
const SEASONS = ['Spring 26','Pre-Fall 26','Fall 26','Holiday 26','Spring 27'];
const CATS    = ['Talent','Location','Rentals','Misc'];

// Tables
const T = {
  media:    'tbl1CuskSkmaO2NrR',
  vip:      'tblLpvlxMQSODfhUW',
  ops:      'tbl8fs7l0zDCQwnr4',
  shoots:   'tblD4slShJJkraZwb',
  lineItems:'tbldxIthZkL8oCTQV',
  overhead: 'tbltLik6uj2uMHwIB',
};

let allData = {};
let activeTab = '6014';
let openShoot = null;
let filter6015 = { season: 'all', type: 'all' };
let filter6018 = { project: 'all' };

// ── UTILS ──
const fmt  = n => n == null ? '—' : '$' + Math.round(n).toLocaleString('en-US');
const fmtD = n => n == null ? '—' : '$' + parseFloat(n).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
const sv   = (f, k) => { const v = f[k]; if (v == null) return ''; if (typeof v === 'object' && !Array.isArray(v) && v.name) return v.name; return v; };
const ids  = (f, k) => { const v = f[k]; if (!Array.isArray(v)) return []; return v.map(x => typeof x === 'object' ? x.id : x); };
const mvs  = (f, k) => { const v = f[k]; if (!Array.isArray(v)) return []; return v.map(x => typeof x === 'object' ? (x.name || x) : x); };
const pct  = (a, b) => b === 0 ? 0 : Math.min(100, (a / b * 100));

async function apiFetch(table, params = '') {
  let records = [], offset = '';
  do {
    const sep = params ? '&' : '?';
    const url = `${PROXY}/v0/${BASE}/${table}${params}${offset ? sep+'offset='+offset : ''}`;
    const r = await fetch(url);
    if (!r.ok) throw new Error(await r.text());
    const d = await r.json();
    records = records.concat(d.records);
    offset = d.offset || '';
  } while (offset);
  return records;
}

async function apiPatch(table, id, fields) {
  const url = `${PROXY}/v0/${BASE}/${table}/${id}`;
  const r = await fetch(url, { method: 'PATCH', headers: {'Content-Type':'application/json'}, body: JSON.stringify({fields}) });
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

async function apiPost(table, fields) {
  const url = `${PROXY}/v0/${BASE}/${table}`;
  const r = await fetch(url, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({fields}) });
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

// ── LOAD ALL DATA ──
async function loadAll() {
  const [media, vip, ops, shoots, lineItems, overhead] = await Promise.all([
    apiFetch(T.media),
    apiFetch(T.vip),
    apiFetch(T.ops),
    apiFetch(T.shoots),
    apiFetch(T.lineItems),
    apiFetch(T.overhead),
  ]);

  allData = {
    media: media.map(r => ({
      id: r.id,
      name: r.fields['Name'] || '',
      platform: sv(r.fields, 'Platform'),
      amount: r.fields['Amount'] || 0,
      month: sv(r.fields, 'Month'),
      paid: r.fields['Paid'] || false,
      date: r.fields['Date'] || '',
    })),
    vip: vip.map(r => ({
      id: r.id,
      name: r.fields['Name'] || '',
      type: sv(r.fields, 'Type'),
      recipient: r.fields['Recipient'] || '',
      value: r.fields['Estimated Value'] || 0,
      status: sv(r.fields, 'Gift Status'),
      month: sv(r.fields, 'Month'),
    })),
    ops: ops.map(r => ({
      id: r.id,
      name: r.fields['Name'] || '',
      subcat: sv(r.fields, 'Subcategory'),
      projects: mvs(r.fields, 'Project'),
      amount: r.fields['Amount'] || 0,
      month: sv(r.fields, 'Month'),
      paid: r.fields['Paid'] || false,
      invoice: r.fields['Invoice #'] || '',
    })),
    shoots: shoots.map(r => ({
      id: r.id,
      name: r.fields['Shoot Name'] || '',
      type: sv(r.fields, 'Type'),
      season: sv(r.fields, 'Season'),
    })),
    lineItems: lineItems.map(r => ({
      id: r.id,
      desc: r.fields['Description'] || '',
      cat: sv(r.fields, 'Category'),
      rate: r.fields['Rate'] || 0,
      qty: r.fields['Qty'] || 1,
      days: r.fields['Days'] || 1,
      total: r.fields['Total'] || 0,
      paid: r.fields['Paid'] || false,
      shootIds: ids(r.fields, 'Shoot'),
    })),
    overhead: overhead.map(r => ({
      id: r.id,
      desc: r.fields['Description'] || '',
      amount: r.fields['Amount'] || 0,
      type: sv(r.fields, 'Type'),
      month: sv(r.fields, 'Month'),
      paid: r.fields['Paid'] || false,
    })),
  };

  updateCards();
  renderTab(activeTab);
}

// ── CARD TOTALS ──
function totals6014() {
  const spent  = allData.media.reduce((a, r) => a + r.amount, 0);
  const paid   = allData.media.filter(r => r.paid).reduce((a, r) => a + r.amount, 0);
  return { spent, paid };
}
function totals6015() {
  const liSpent  = allData.lineItems.reduce((a, r) => a + r.total, 0);
  const liPaid   = allData.lineItems.filter(r => r.paid).reduce((a, r) => a + r.total, 0);
  const ohSpent  = allData.overhead.reduce((a, r) => a + r.amount, 0);
  const ohPaid   = allData.overhead.filter(r => r.paid).reduce((a, r) => a + r.amount, 0);
  return { spent: liSpent + ohSpent, paid: liPaid + ohPaid };
}
function totals6016() {
  const spent = allData.vip.reduce((a, r) => a + r.value, 0);
  return { spent, paid: allData.vip.filter(r => r.status === 'Confirmed').reduce((a, r) => a + r.value, 0) };
}
function totals6018() {
  const spent = allData.ops.reduce((a, r) => a + r.amount, 0);
  const paid  = allData.ops.filter(r => r.paid).reduce((a, r) => a + r.amount, 0);
  return { spent, paid };
}

function updateCards() {
  const map = { '6014': totals6014(), '6015': totals6015(), '6016': totals6016(), '6018': totals6018() };
  for (const [code, t] of Object.entries(map)) {
    const budget = BUDGETS[code];
    const rem = budget - t.spent;
    const paidPct = pct(t.paid, budget);
    const commPct = pct(t.spent - t.paid, budget);
    document.getElementById(`c${code}-spent`).textContent = fmt(t.spent);
    document.getElementById(`c${code}-rem`).textContent = fmt(Math.max(0, rem)) + ' remaining';
    document.getElementById(`c${code}-pct`).textContent = pct(t.spent, budget).toFixed(1) + '%';
    document.getElementById(`c${code}-bar-paid`).style.width = paidPct.toFixed(1) + '%';
    document.getElementById(`c${code}-bar-comm`).style.width = commPct.toFixed(1) + '%';
    const remEl = document.getElementById(`c${code}-rem`);
    remEl.style.color = rem < 0 ? 'var(--sienna)' : '';
  }
}

// ── TAB SWITCH ──
function switchTab(tab) {
  activeTab = tab;
  openShoot = null;
  document.querySelectorAll('.bcard').forEach(c => c.classList.toggle('active', c.dataset.tab === tab));
  renderTab(tab);
}

function renderTab(tab) {
  document.getElementById('panel-loading').style.display = 'none';
  document.getElementById('panel-content').style.display = 'block';
  const el = document.getElementById('panel-content');
  if (tab === '6014') el.innerHTML = render6014();
  else if (tab === '6015') el.innerHTML = render6015();
  else if (tab === '6016') el.innerHTML = render6016();
  else if (tab === '6018') el.innerHTML = render6018();
}

// ── 6015 CONTENT PRODUCTION ──
function render6015() {
  const fs = filter6015;

  // Filter shoots
  const visibleShoots = allData.shoots.filter(s =>
    (fs.season === 'all' || s.season === fs.season) &&
    (fs.type   === 'all' || s.type   === fs.type)
  );

  const shootItems = id => allData.lineItems.filter(li => li.shootIds.includes(id));
  const shootTotal = id => shootItems(id).reduce((a,li) => a+li.total, 0);

  // Totals based on filtered shoots
  const filteredLITotal = visibleShoots.reduce((a,s) => a+shootTotal(s.id), 0);
  const filteredLIPaid  = visibleShoots.reduce((a,s) => a+shootItems(s.id).filter(li=>li.paid).reduce((b,li)=>b+li.total,0), 0);

  // Full totals for stats when no filter active
  const allLITotal = allData.lineItems.reduce((a,r) => a+r.total, 0);
  const ohTotal    = allData.overhead.reduce((a,r) => a+r.amount, 0);
  const ohPaid     = allData.overhead.filter(r=>r.paid).reduce((a,r) => a+r.amount, 0);
  const grandTotal = allLITotal + ohTotal;
  const grandPaid  = allData.lineItems.filter(r=>r.paid).reduce((a,r)=>a+r.total,0) + ohPaid;

  // Season totals for chips
  const seasonTotals = {};
  SEASONS.forEach(s => {
    const ss = allData.shoots.filter(sh => sh.season===s && (fs.type==='all'||sh.type===fs.type));
    seasonTotals[s] = ss.reduce((a,sh)=>a+shootTotal(sh.id),0);
  });
  const typeTotals = {};
  TYPES.forEach(t => {
    const ts = allData.shoots.filter(sh => sh.type===t && (fs.season==='all'||sh.season===fs.season));
    typeTotals[t] = ts.reduce((a,sh)=>a+shootTotal(sh.id),0);
  });

  const isFiltered = fs.season !== 'all' || fs.type !== 'all';
  const displayTotal = isFiltered ? filteredLITotal : grandTotal;
  const displayPaid  = isFiltered ? filteredLIPaid  : grandPaid;

  const statsHtml = `

  // Filter chips
  const seasonChips = `

  const typeChips = `
    <div class="filter-row">
      <span class="filter-label">Type</span>
      <button class="chip ${fs.type==='all'?'active':''}" onclick="set6015Filter('type','all')">All</button>

  // Shoot rows — ordered by type then season

  // ── PROJECT FILTER CHIPS ──
  const projChips = `
    <div class="filter-section">
      <div class="filter-row">
        <span class="filter-label">Project</span>
        <button class="chip ${fp==='all'?'active':''}" onclick="set6018Filter('all')">All <span style="opacity:.5;font-size:11px">${fmt(total)}</span></button>
        ${PROJECTS.map(p => projTotals[p] > 0 ? `<button class="chip ${fp===p?'active':''}" onclick="set6018Filter('${p}')">${p} <span style="opacity:.5;font-size:11px">${fmt(projTotals[p])}</span></button>` : '').join('')}
      </div>
    </div>`;

  // ── RETAINER CARDS ──
  const retainerCards = RETAINERS.map(ret => {
    const rows = retainerRows.filter(r => r.name.startsWith(ret.key));
    const retTotal = rows.reduce((a,r) => a+r.amount, 0);
    const retPaid  = rows.filter(r=>r.paid).reduce((a,r) => a+r.amount, 0);
    const paidCount = rows.filter(r=>r.paid).length;
    const totalCount = rows.length;
    const summaryClass = paidCount === totalCount && totalCount > 0 ? 'done' : paidCount === 0 ? 'none' : 'partial';
    const summaryText  = paidCount === totalCount && totalCount > 0 ? 'fully paid' : `${paidCount}/${totalCount} paid`;

    const monthTiles = MONTHS.map(m => {
      const rec = rows.find(r => r.month === m);
      if (!rec) return '';
      return `<div class="month-tile ${rec.paid?'paid-m':''}" onclick="toggleOpsPaid('${rec.id}',${!rec.paid})" style="cursor:pointer">
        <div class="month-name">${m.slice(0,3)}</div>
        <div class="month-amt" style="font-size:13px">${rec.amount === 3000 ? '$3k' : rec.amount === 2900 ? '$2.9k' : '$'+rec.amount.toLocaleString()}</div>
        <div class="month-check">
          <input type="checkbox" class="cb" style="appearance:none;width:13px;height:13px;border:1.5px solid var(--rule);border-radius:3px;background:${rec.paid?'var(--sage)':'white'};border-color:${rec.paid?'var(--sage)':'var(--rule)'};pointer-events:none;display:inline-block;position:relative;" ${rec.paid?'checked':''}>
        </div>
      </div>`;
    }).join('');

    return `<div style="border:1px solid var(--rule);border-radius:6px;margin-bottom:10px;overflow:hidden">
      <div style="display:grid;grid-template-columns:1fr 120px 130px;gap:8px;align-items:center;padding:.85rem 1.25rem;cursor:pointer" onclick="toggleRetainer('${ret.key}')">
        <div>
          <div style="font-size:14px;font-weight:500">${ret.label}</div>
          <div style="font-size:12px;color:var(--light);margin-top:1px">${ret.subtitle}</div>
        </div>
        <div style="font-size:20px;font-weight:300;text-align:right;font-variant-numeric:tabular-nums">${fmt(retTotal)}</div>
        <div style="text-align:right">
          <span style="font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:${summaryClass==='done'?'var(--sage)':summaryClass==='none'?'var(--light)':'var(--sienna)'}">${summaryText}</span>
        </div>
      </div>
      <div id="ret-${ret.key.replace(/\s/g,'-')}" style="display:none;border-top:1px solid var(--rule-lt);padding:.85rem 1.25rem">
        <div class="month-grid" style="grid-template-columns:repeat(6,1fr)">
          ${monthTiles || '<div style="color:var(--light);font-size:13px;grid-column:1/-1">No months scheduled</div>'}
        </div>
        <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--light);margin-top:8px;padding-top:8px;border-top:1px solid var(--rule-lt)">
          <span>${paidCount} of ${totalCount} months paid</span>
          <span style="font-variant-numeric:tabular-nums">${fmt(retPaid)} of ${fmt(retTotal)}</span>
        </div>
      </div>
    </div>`;
  }).join('');

  // ── SPLIT BARS (unfiltered only) ──
  const splitHtml = !isFiltered ? `
    <div class="divider"></div>
    <div class="sec-label"><span>By project</span></div>
    <div class="split-bars">
      ${PROJECTS.filter(p=>projTotals[p]>0).sort((a,b)=>projTotals[b]-projTotals[a]).map(p=>`
      <div class="split-row">
        <div class="split-label" style="font-size:13px">${p}</div>
        <div class="split-track"><div class="split-fill" style="background:var(--champagne);width:${pct(projTotals[p],projMax).toFixed(1)}%"></div></div>
        <div class="split-amt">${fmt(projTotals[p])}</div>
      </div>`).join('')}
    </div>` : '';

  // ── ONE-OFF TABLE ──
  const subcatSection = (label, subcat, rows) => {
    const filtered = fp === 'all' ? rows : rows.filter(r => r.projects.includes(fp));
    if (!filtered.length) return '';
    const secTotal = filtered.reduce((a,r)=>a+r.amount,0);
    return `
      <div class="sec-label" style="margin-top:1.25rem"><span>${label}</span><span class="sec-total">${fmt(secTotal)}</span></div>
      <table class="data-table">
        <thead><tr><th>Description</th><th>Project</th><th>Month</th><th class="r">Amount</th><th class="r">Status</th></tr></thead>
        <tbody>${filtered.map(r=>`<tr>
          <td style="font-size:14px">${r.name}</td>
          <td>${r.projects.map(p=>`<span class="pill" style="background:${p===fp?'#1C1917':'#F5F0EB'};color:${p===fp?'white':'var(--mid)'};margin-right:3px;font-size:10px">${p}</span>`).join('')}</td>
          <td class="dim">${r.month}</td>
          <td class="r num">${fmtD(r.amount)}</td>
          <td class="r"><label class="paid-cb ${r.paid?'is-paid':''}" onclick="event.stopPropagation()">
            <input type="checkbox" ${r.paid?'checked':''} onchange="toggleOpsPaid('${r.id}',this.checked)">
            <span>${r.paid?'Paid':'Unpaid'}</span>
          </label></td>
        </tr>`).join('')}</tbody>
        <tfoot><tr><td colspan="3"><strong>Total</strong></td><td class="r">${fmt(secTotal)}</td><td></td></tr></tfoot>
      </table>`;
  };

  const toolRows   = oneOffRows.filter(r=>r.subcat==='Tool');
  const vendorRows = oneOffRows.filter(r=>r.subcat==='Outside Vendor');

  return `
    <div class="panel-header">
      <div><div class="panel-title">6018 · Operating Costs</div><div class="panel-subtitle">Retainers, vendors & software</div></div>
      <div style="font-size:13px;color:var(--light)">${fmt(BUDGETS['6018'] - total)} remaining of $105,000</div>
    </div>
    <div class="panel-body">
      ${statsHtml}
      ${projChips}
      <div class="sec-label" style="margin-bottom:10px"><span>Retainers</span><span class="sec-total">${fmt(retainerTotal)}</span></div>
      ${retainerCards}
      ${splitHtml}
      ${subcatSection('Outside Vendors', 'Outside Vendor', vendorRows)}
      ${subcatSection('Software & Tools', 'Tool', toolRows)}
    </div>`;
}

// ── INTERACTIONS ──
function toggleRetainer(key) {
  const id = 'ret-' + key.replace(/\s/g, '-');
  const el = document.getElementById(id);
  if (el) el.style.display = el.style.display === 'none' ? 'block' : 'none';
}

function set6015Filter(axis, value) {
  openShoot = null;
  filter6015[axis] = value;
  renderTab('6015');
}

function set6018Filter(value) {
  filter6018.project = value;
  renderTab('6018');
}

function toggleShoot(id) {
  openShoot = openShoot === id ? null : id;
  renderTab('6015');
}

async function toggleLIPaid(id, paid) {
  try {
    await apiPatch(T.lineItems, id, {'Paid': paid});
    const li = allData.lineItems.find(l => l.id === id);
    if (li) li.paid = paid;
    updateCards(); renderTab('6015');
  } catch(e) { alert('Save failed: ' + e.message); }
}

async function toggleOHPaid(id, paid) {
  const paidBool = paid === true || paid === 'true';
  try {
    await apiPatch(T.overhead, id, {'Paid': paidBool});
    const o = allData.overhead.find(x => x.id === id);
    if (o) o.paid = paidBool;
    updateCards(); renderTab('6015');
  } catch(e) { alert('Save failed: ' + e.message); }
}

async function toggleMediaPaid(month, paid) {
  try {
    const toUpdate = allData.media.filter(r => r.month === month);
    await Promise.all(toUpdate.map(r => apiPatch(T.media, r.id, {'Paid': paid})));
    toUpdate.forEach(r => r.paid = paid);
    updateCards(); renderTab('6014');
  } catch(e) { alert('Save failed: ' + e.message); }
}

async function toggleOpsPaid(id, paid) {
  const paidBool = paid === true || paid === 'true';
  try {
    await apiPatch(T.ops, id, {'Paid': paidBool});
    const o = allData.ops.find(x => x.id === id);
    if (o) o.paid = paidBool;
    updateCards(); renderTab('6018');
  } catch(e) { alert('Save failed: ' + e.message); }
}

function showAddVIP() {
  const f = document.getElementById('vip-add-form');
  f.style.display = f.style.display === 'none' ? 'flex' : 'none';
}

async function saveVIP() {
  const name  = document.getElementById('vip-name').value.trim();
  const recip = document.getElementById('vip-recip').value.trim();
  const type  = document.getElementById('vip-type').value;
  const val   = parseFloat(document.getElementById('vip-val').value) || 0;
  const month = document.getElementById('vip-month').value;
  if (!name) return;
  try {
    const r = await apiPost(T.vip, {'Name': name, 'Recipient': recip, 'Type': type, 'Estimated Value': val, 'Month': month, 'Gift Status': 'Planned'});
    allData.vip.push({id: r.id, name, recipient: recip, type, value: val, month, status: 'Planned'});
    updateCards(); renderTab('6016');
  } catch(e) { alert('Save failed: ' + e.message); }
}

// ── INIT ──
(async () => {
  try {
    await loadAll();
  } catch(e) {
    document.getElementById('panel-loading').innerHTML = `<div class="error-msg">Failed to load: ${e.message}</div>`;
  }
})();
</script>
</body>
</html>
